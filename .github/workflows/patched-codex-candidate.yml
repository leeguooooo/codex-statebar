name: Patched Codex candidate

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [macos-arm64, macos-x86_64, linux-x86_64, linux-arm64, remaining, all]
        default: macos-arm64

      reuse_cached_binary:
        description: Explicit recovery after a successful compile but failed acceptance
        type: boolean
        default: false

permissions:
  contents: read

# libgit2 drops long submodule clones (v8 → chromium icu); system git retries cleanly.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = [
              {"os": "macos-15", "target": "macos-arm64"},
              {"os": "macos-15-intel", "target": "macos-x86_64"},
              {"os": "ubuntu-24.04", "target": "linux-x86_64"},
              {"os": "ubuntu-24.04-arm", "target": "linux-arm64"},
          ]
          mode = os.environ['PLATFORMS']
          selected = targets if mode == 'all' else (targets[1:] if mode == 'remaining' else [t for t in targets if t['target'] == mode])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': selected}) + '\n')
          PY
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CODEX_RUN_PATCH_TESTS: "1"
      # No Codex version in this file: the upstream-follow bot bumps the version
      # with GITHUB_TOKEN, which may not push changes to workflow files.
      CODEX_BUILD_ROOT: ${{ github.workspace }}/build/codex
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/codex/target
          key: codex-candidate-${{ matrix.target }}-${{ hashFiles('patches/codex-*.patch', 'scripts/build-patched-codex.sh') }}
          restore-keys: codex-candidate-${{ matrix.target }}-
      - name: Build or recover compiled binary
        id: native_build
        env:
          REUSE: ${{ inputs.reuse_cached_binary }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$REUSE" = "true" ]; then
            test "$CACHE_HIT" = "true"
            test -x build/codex/target/release/codex
            mkdir -p dist
            cp build/codex/target/release/codex dist/codex-cxs
          else
            ./scripts/build-patched-codex.sh
          fi
      - run: ./dist/codex-cxs --version
      - run: python3 scripts/verify_embedded_codex.py dist/codex-cxs
      - uses: actions/upload-artifact@v4
        if: failure() && steps.native_build.outcome == 'success'
        with:
          name: codex-cxs-${{ matrix.target }}-compiled-unverified
          path: dist/codex-cxs
      - name: Package verified candidate
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -czf "dist/codex-cxs-$TARGET.tar.gz" -C dist codex-cxs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          asset = Path('dist') / ('codex-cxs-' + os.environ['TARGET'] + '.tar.gz')
          asset.with_name(asset.name + '.sha256').write_text(hashlib.sha256(asset.read_bytes()).hexdigest() + '  ' + asset.name + '\n')
          PY
          python3 scripts/codex_build_manifest.py fingerprint > "dist/codex-cxs-$TARGET.fingerprint"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-cxs-${{ matrix.target }}-candidate
          path: |
            dist/codex-cxs-${{ matrix.target }}.tar.gz
            dist/codex-cxs-${{ matrix.target }}.tar.gz.sha256
            dist/codex-cxs-${{ matrix.target }}.fingerprint
      - name: Stop leftover compiler children before cache snapshot
        if: failure() || cancelled()
        run: |
          python3 - <<'PYSTOP'
          import os, shlex, signal, subprocess, time
          scope = os.getcwd() + '/build/codex/'
          for sig in (signal.SIGTERM, signal.SIGKILL):
              for row in subprocess.check_output(['ps', '-axo', 'pid=,command='], text=True).splitlines():
                  bits = row.strip().split(None, 1)
                  if len(bits) != 2: continue
                  try: args = shlex.split(bits[1])
                  except ValueError: continue
                  if args and os.path.basename(args[0]) in ('cargo', 'rustc', 'clang', 'cc', 'ld') and any(scope in arg for arg in args):
                      try: os.kill(int(bits[0]), sig)
                      except ProcessLookupError: pass
              time.sleep(1)
          PYSTOP
      - uses: actions/cache/save@v4
        if: always() && !inputs.reuse_cached_binary
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/codex/target
          key: codex-candidate-${{ matrix.target }}-${{ hashFiles('patches/codex-*.patch', 'scripts/build-patched-codex.sh') }}
