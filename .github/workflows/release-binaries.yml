name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-patched-codex:
    runs-on: ubuntu-latest
    outputs:
      source_tag: ${{ steps.find.outputs.source_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          source_tag=""
          while IFS= read -r tag; do
            manifest_dir="$(mktemp -d)"
            if gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern codex-cxs-manifest.json \
              --dir "$manifest_dir" >/dev/null 2>&1 &&
              python3 scripts/codex_build_manifest.py matches \
                "$manifest_dir/codex-cxs-manifest.json"; then
              source_tag="$tag"
              rm -rf "$manifest_dir"
              break
            fi
            rm -rf "$manifest_dir"
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[].tag_name'
          )
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$source_tag" ]]; then
            echo "Reusing patched Codex assets from $source_tag"
          else
            echo "No matching patched Codex assets found; a cold build is required"
          fi

  build:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: macos-x86_64
            binary: cxs
          - os: macos-15
            target: macos-arm64
            binary: cxs
          - os: ubuntu-24.04
            target: linux-x86_64
            binary: cxs
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: cxs
          - os: windows-latest
            target: windows-x86_64
            binary: cxs.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --clean --onefile --name cxs --collect-data codex_statebar src/codex_statebar/__main__.py
      - shell: bash
        run: |
          mkdir package
          cp "dist/${{ matrix.binary }}" "package/${{ matrix.binary }}"
          tar -czf "cxs-${{ matrix.target }}.tar.gz" -C package "${{ matrix.binary }}"
          python -c "import hashlib,pathlib; p=pathlib.Path('cxs-${{ matrix.target }}.tar.gz'); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: cxs-${{ matrix.target }}
          path: |
            cxs-${{ matrix.target }}.tar.gz
            cxs-${{ matrix.target }}.tar.gz.sha256

  build-patched-codex:
    needs: find-patched-codex
    if: needs.find-patched-codex.outputs.source_tag == ''
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build-patched-codex.sh
      - shell: bash
        run: |
          mkdir patched-package
          cp dist/codex-cxs patched-package/codex-cxs
          tar -czf "codex-cxs-${{ matrix.target }}.tar.gz" -C patched-package codex-cxs
          python3 -c "import hashlib,pathlib; p=pathlib.Path('codex-cxs-${{ matrix.target }}.tar.gz'); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-cxs-${{ matrix.target }}
          path: |
            codex-cxs-${{ matrix.target }}.tar.gz
            codex-cxs-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: [find-patched-codex, build, build-patched-codex]
    if: >-
      always() &&
      needs.find-patched-codex.result == 'success' &&
      needs.build.result == 'success' &&
      (
        needs.build-patched-codex.result == 'success' ||
        (
          needs.build-patched-codex.result == 'skipped' &&
          needs.find-patched-codex.outputs.source_tag != ''
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cxs-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.find-patched-codex.outputs.source_tag == ''
        with:
          pattern: codex-cxs-*
          merge-multiple: true
          path: dist
      - name: Reuse matching patched Codex assets
        if: needs.find-patched-codex.outputs.source_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ needs.find-patched-codex.outputs.source_tag }}
        run: |
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'codex-cxs-*.tar.gz' \
            --pattern 'codex-cxs-*.tar.gz.sha256' \
            --pattern codex-cxs-manifest.json \
            --dir dist
          python3 scripts/codex_build_manifest.py verify \
            dist/codex-cxs-manifest.json dist
      - name: Create patched Codex asset manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/codex_build_manifest.py create \
            dist \
            --source-tag "$RELEASE_TAG"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
